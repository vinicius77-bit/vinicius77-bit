<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Fundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"></stop>
      <stop offset="100%" stop-color="#080000"></stop>
    </linearGradient>

    <!-- Vermelho neon -->
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0000"></stop>
      <stop offset="50%" stop-color="#ff3333"></stop>
      <stop offset="100%" stop-color="#990000"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Rede do fundo -->
    <pattern id="network" width="120" height="70" patternUnits="userSpaceOnUse">

      <path d="M0 10 L60 35 L120 5
               M0 60 L60 35 L120 65
               M60 0 L60 35" stroke="#420000" stroke-width="1" fill="none"></path>

      <circle cx="60" cy="35" r="2.5" fill="#ff0000" opacity="0.7"></circle>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="1000" height="300" fill="url(#bg)"></rect>

  <!-- Rede -->
  <rect width="1000" height="300" fill="url(#network)" opacity="0.8"></rect>

  <!-- Hexágono esquerdo -->
  <g transform="translate(105 155)" filter="url(#glow)">
    <polygon points="-60,-70 0,-105 60,-70
                     60,0 0,35 -60,0" fill="#050505" stroke="url(#red)" stroke-width="8"></polygon>

    <text x="0" y="-5" text-anchor="middle" font-family="monospace" font-size="55" font-weight="bold" fill="#ff2222">
      &lt;/&gt;
    </text>
  </g>

  <!-- Hexágono direito -->
  <g transform="translate(895 155)" filter="url(#glow)">
    <polygon points="-60,-70 0,-105 60,-70
                     60,0 0,35 -60,0" fill="#050505" stroke="url(#red)" stroke-width="8"></polygon>

    <text x="0" y="-5" text-anchor="middle" font-family="monospace" font-size="55" font-weight="bold" fill="#ff2222">
      &lt;/&gt;
    </text>
  </g>

  <!-- Nome -->
  <text x="500" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="400" fill="#ffffff">
    Hey! I am Vinicius Adolfo
  </text>

  <!-- Profissão -->
  <text x="500" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="italic" fill="#ff3333">
    Fullstack developer
  </text>

</svg>